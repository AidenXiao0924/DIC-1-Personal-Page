<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta
      name="description"
      content="個人課程作業首頁，顯示瀏覽器本地日期與時間。"
    />
    <meta name="theme-color" content="#101346" />
    <title>個人首頁｜課程作業</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23121955'/%3E%3Ccircle cx='32' cy='32' r='18' fill='none' stroke='%236ee7f5' stroke-width='5'/%3E%3Cpath d='M32 20v13l9 6' fill='none' stroke='%23ffffff' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="styles.css?v=20260916-2" />
    <script src="script.js?v=20260916-2" defer></script>
  </head>
  <!-- 修改姓名時，只需更改下一行 data-profile-name 的內容。 -->
  <body data-profile-name="Aiden Xiao">
    <a class="skip-link" href="#main-content">跳至主要內容</a>

    <main class="stage" id="main-content">
      <div class="ambient ambient-one" aria-hidden="true"></div>
      <div class="ambient ambient-two" aria-hidden="true"></div>

      <article class="profile-card" aria-labelledby="page-title">
        <header class="card-header">
          <span class="status-pill">
            <span class="status-dot" aria-hidden="true"></span>
            ONLINE · COURSEWORK
          </span>
          <span class="card-index" aria-label="第一份作品">01 / PERSONAL</span>
        </header>

        <section class="identity">
          <p class="eyebrow">Hello, I am</p>
          <h1 id="page-title" data-profile-name></h1>
          <p class="role">學生 · 網頁設計初學者</p>
          <p class="intro">
            這是我的個人課程作業首頁，也是我練習 HTML、CSS 與 JavaScript 的起點。
          </p>
        </section>

        <div class="divider" aria-hidden="true"></div>

        <section class="clock-panel" aria-labelledby="clock-title">
          <div class="clock-label">
            <h2 id="clock-title">LOCAL TIME</h2>
            <span id="timezone-label">瀏覽器本地時區</span>
          </div>

          <time id="current-time" datetime="" aria-live="off">--:--:--</time>
          <p id="current-date">正在讀取日期…</p>
          <p class="sr-only" id="accessible-time" aria-live="polite"></p>
        </section>

        <footer class="card-footer">
          <p>時間會依照你的裝置每秒更新</p>
          <p>© <span id="current-year"></span> <span data-profile-name></span></p>
        </footer>
      </article>
    </main>

    <noscript>
      <p class="noscript-message">請啟用 JavaScript，以顯示即時日期與時間。</p>
    </noscript>
  </body>
</html>
